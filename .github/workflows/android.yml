name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "App version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Robolectric SDK 36 needs Java 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK; only accept its licences (Gradle then installs
      # the platform / build-tools the project asks for).
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The debug build is signed with ./debug.keystore (see app/build.gradle.kts).
      # Add a DEBUG_KEYSTORE_BASE64 repository secret to sign every build with the same key,
      # so a newer APK installs over an older one. Without it a fresh key is generated per run.
      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating a one-off signing key."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/PhotoEasy-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEasy-apk
          path: dist/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    # Runs for: a push to main (creates Release v<versionName> once, when that version has no
    # Release yet: bump versionName in app/build.gradle.kts to publish a new one), a pushed v* tag,
    # or a Release published on GitHub (the APK is attached to it).
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decide the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $TAG already exists; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          name: PhotoEasy-apk
          path: dist

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PhotoEasy ${{ steps.tag.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### Install
            Download the APK below and open it on an Android 7.0+ device (allow installing from this source when asked).
            The APK is debug-signed. Unless a fixed key is set in the `DEBUG_KEYSTORE_BASE64` repository secret, each release is signed with a new key, so uninstall the previous version before installing a newer one.
