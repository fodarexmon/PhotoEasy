name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "App version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (Robolectric SDK 36 needs Java 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK; only accept its licences (Gradle then installs
      # the platform / build-tools the project asks for).
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The debug build is signed with ./debug.keystore (see app/build.gradle.kts).
      # Add a DEBUG_KEYSTORE_BASE64 repository secret to sign every build with the same key,
      # so a newer APK installs over an older one. Without it a fresh key is generated per run.
      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating a one-off signing key."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Robolectric downloads its Android framework jars from Maven Central while the tests run.
      # Keep them between runs so a Maven Central hiccup doesn't fail the build.
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Unit tests
        run: |
          if ./gradlew testDebugUnitTest --stacktrace; then exit 0; fi
          # Retry once, only when the failure was the Robolectric download.
          if grep -rqs "MavenArtifactFetcher" app/build/test-results/testDebugUnitTest; then
            echo "::warning::Robolectric could not download its Android jars; retrying in 60 s"
            sleep 60
            ./gradlew testDebugUnitTest --stacktrace
          else
            exit 1
          fi

      # R8-shrunk build, one APK per processor type plus a universal one.
      - name: Build APKs
        run: ./gradlew assembleDist --stacktrace

      # R8 once renamed ML Kit's internal classes, and face detection silently found nothing in
      # release builds. Fail the build if that happens again.
      - name: Check ML Kit survived R8
        run: |
          apk=$(ls app/build/outputs/apk/dist/*arm64-v8a*.apk | head -1)
          n=$(unzip -p "$apk" 'classes*.dex' | strings -a | grep -c 'mlkit_vision_face_bundled' || true)
          echo "ML Kit internal class references in $apk: $n"
          if [ "$n" -lt 10 ]; then echo "::error::R8 renamed ML Kit's internal classes; face detection would fail"; exit 1; fi

      - name: Rename APKs
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.version }}"
          ls -l app/build/outputs/apk/dist/
          for f in app/build/outputs/apk/dist/*.apk; do
            case "$f" in
              *universal*) cp "$f" "dist/PhotoEasy-v$V.apk" ;;
              *arm64-v8a*) cp "$f" "dist/PhotoEasy-v$V-arm64-v8a.apk" ;;
              *armeabi-v7a*) cp "$f" "dist/PhotoEasy-v$V-armeabi-v7a.apk" ;;
              *x86_64*) cp "$f" "dist/PhotoEasy-v$V-x86_64.apk" ;;
            esac
          done
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEasy-apk
          path: dist/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    # Runs for: a push to main (creates Release v<versionName> once, when that version has no
    # Release yet: bump versionName in app/build.gradle.kts to publish a new one), a pushed v* tag,
    # or a Release published on GitHub (the APK is attached to it).
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decide the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="v$VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $TAG already exists; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          name: PhotoEasy-apk
          path: dist

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PhotoEasy ${{ steps.tag.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### Install
            Download the APK below and open it on an Android 7.0+ device (allow installing from this source when asked).
            Most phones: `-arm64-v8a.apk` (smallest). Older 32-bit phones: `-armeabi-v7a.apk`. Not sure: the plain `.apk` works everywhere.
            The APK is debug-signed. Unless a fixed key is set in the `DEBUG_KEYSTORE_BASE64` repository secret, each release is signed with a new key, so uninstall the previous version before installing a newer one.
